name: Repo checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n install.sh

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/api/package-lock.json

      - name: Core API setup
        working-directory: core/api
        run: npm ci

      - name: Core API checks
        working-directory: core/api
        run: |
          npm run lint
          npm test
          npm run build

      - name: Markdown relative links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          link_re = re.compile(r'\[[^\]]+\]\(([^)]+)\)|<a\s+[^>]*href="([^"]+)"', re.I)
          missing = []

          for path in root.rglob("*.md"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              for match in link_re.finditer(text):
                  target = (match.group(1) or match.group(2) or "").strip()
                  if not target or target.startswith(("#", "http://", "https://", "mailto:")):
                      continue
                  clean = target.split("#", 1)[0].replace("%20", " ")
                  if clean and not (path.parent / clean).resolve().exists():
                      missing.append(f"{path.relative_to(root)} -> {target}")

          if missing:
              raise SystemExit("Missing relative links:\n" + "\n".join(missing))
          print("Markdown relative links: ok")
          PY
